
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SociAI Studio — posty i grafiki dla Twojej marki</title>
    <meta name="description" content="Przygotuj DNA marki, plan postów i grafiki. Wypróbuj bezpłatny warsztat lub zacznij z 500 kredytami AI na 7 dni po rejestracji karty. Potem 49 zł/mies.">
    <meta property="og:title" content="SociAI Studio — Twoja pierwsza misja w social mediach">
    <meta property="og:description" content="Bezpłatny warsztat postów i grafik. 500 FC / 7 dni po rejestracji karty. Potem 49 zł/mies.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#070915">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="starfield" id="starfield"></div>
    <div id="root"></div>
    <script>
        const starfield = document.getElementById('starfield');
        if (starfield) {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.5 + 0.1;
                starfield.appendChild(star);
            }
        }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
